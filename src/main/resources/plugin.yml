name: EntityProtection
version: '${version}'
main: dev.nerzul.entityprotection.EntityProtectionPlugin
api-version: '26.2'
author: Nerzul
description: Protects blocks a player places (containers, and optionally doors) so only the owner and trusted players can access them.

commands:
  protect:
    description: Manage protection on the block you are looking at.
    usage: /protect <trust|untrust|trustall|untrustall> <player> | /protect <info|remove>
    permission: entityprotection.use

permissions:
  entityprotection.use:
    description: Allows using /protect and owning protections on placed blocks.
    default: true
  entityprotection.admin:
    description: Allows bypassing every protection (open, break, trust management on any block).
    default: op
